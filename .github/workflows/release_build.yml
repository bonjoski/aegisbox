name: Tri-Platform Production Release Build Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            target: aarch64-apple-darwin
            binary_name: aegisbox
          - os: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
            binary_name: aegisbox
          - os: windows-2025
            arch: amd64
            target: x86_64-pc-windows-msvc
            binary_name: aegisbox.exe

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Run Go Unit & Adversarial Tests
        run: |
          go test -v ./...

      - name: Build Aegisbox Core Binaries
        env:
          BINARY_NAME: ${{ matrix.binary_name }}
        run: |
          go build -ldflags="-s -w" -o "bin/${BINARY_NAME}" ./cmd/aegisbox
          go build -ldflags="-s -w" -o bin/aegisboxd ./cmd/aegisboxd
          go build -ldflags="-s -w" -o bin/aegisbox-netd ./cmd/aegisbox-netd

      - name: Install Linux Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri Desktop Cockpit
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          cd desktop
          npm ci
          npm run build
          cd src-tauri
          cargo build --release --target "${RUST_TARGET}"

      - name: Compute Cryptographic SHA256 Checksums
        shell: bash
        run: |
          cd bin
          shasum -a 256 * > SHA256SUMS || sha256sum * > SHA256SUMS

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aegisbox-${{ matrix.target }}
          path: |
            bin/
            desktop/src-tauri/target/${{ matrix.target }}/release/aegisbox-desktop*
