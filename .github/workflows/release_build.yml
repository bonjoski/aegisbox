name: Tri-Platform Production Release Build Matrix

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package (${{ matrix.os }} - ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
            target: aarch64-apple-darwin
            binary_name: aegisbox
          - os: ubuntu-24.04
            arch: amd64
            target: x86_64-unknown-linux-gnu
            binary_name: aegisbox
          - os: windows-2025
            arch: amd64
            target: x86_64-pc-windows-msvc
            binary_name: aegisbox.exe

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Go Unit & Adversarial Tests
        run: |
          go test -v ./...

      - name: Build Aegisbox Core Binaries
        run: |
          go build -ldflags="-s -w" -o bin/${{ matrix.binary_name }} ./cmd/aegisbox
          go build -ldflags="-s -w" -o bin/aegisboxd ./cmd/aegisboxd
          go build -ldflags="-s -w" -o bin/aegisbox-netd ./cmd/aegisbox-netd

      - name: Install Linux Dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri Desktop Cockpit
        run: |
          cd desktop
          npm ci
          npm run build
          cd src-tauri
          cargo build --release --target ${{ matrix.target }}

      - name: Compute Cryptographic SHA256 Checksums
        shell: bash
        run: |
          cd bin
          shasum -a 256 * > SHA256SUMS || sha256sum * > SHA256SUMS

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aegisbox-${{ matrix.target }}
          path: |
            bin/
            desktop/src-tauri/target/${{ matrix.target }}/release/aegisbox-desktop*
