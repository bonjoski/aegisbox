[package]
name = "aegisbox-desktop"
version = "0.5.1"
description = "Aegisbox Desktop Cockpit & Multiplatform Tray"
authors = ["bonjoski"]
edition = "2021"

[lib]
name = "aegisbox_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
cc = "1.0"

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
